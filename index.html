<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<title>
練字 PDF 產生器
</title>

</head>


<body>


<h1>
練字 PDF 產生器
</h1>



<form action="/create" method="post">


<textarea

name="content"

rows="15"

cols="50"

placeholder="請輸入文章">

</textarea>


<br><br>


<label>
每行字數：
</label>


<input

type="number"

name="cols"

value="10"

min="1"

max="20">


<br><br>



<label>
字帖格式：
</label>


<select name="style">


<option value="mi">

米字格

</option>


<option value="tian">

田字格

</option>


<option value="jiu">

九宮格

</option>


<option value="blank">

空白格

</option>


</select>


<br><br>







<br><br>


<button>

產生 PDF

</button>


</form>


</body>

</html>
